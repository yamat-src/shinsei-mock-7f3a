<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>申込Webモック環境</title>
<style>
  body{font-family:"Yu Gothic","Meiryo",sans-serif;font-size:13px;color:#222;background:#f4f5f7;margin:0}
  .site{max-width:1100px;margin:0 auto;background:#fff;min-height:100vh}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;color:#fff}
  .hep .hdr{background:#0b6e4f}.hpg .hdr{background:#2b3a67}.admin .hdr{background:#444}
  .hdr b{font-size:16px}.hdr small{opacity:.9}
  .ttl{font-weight:bold;font-size:15px;padding:8px 16px;border-bottom:2px solid #ccc;background:#fafafa}
  .cnt{padding:12px 16px}
  table.f{border-collapse:collapse;width:100%;margin:8px 0}
  table.f th,table.f td{border:1px solid #bbb;padding:5px 8px;vertical-align:top;font-size:12px}
  table.f th{background:#e8ebf0;text-align:left;width:190px;font-weight:normal}
  table.r{border-collapse:collapse;width:100%;font-size:12px}
  table.r th,table.r td{border:1px solid #bbb;padding:4px 6px}
  table.r th{background:#dfe4ec}
  input[type=text],input[type=password],select{font-size:12px;padding:3px;border:1px solid #999}
  input[type=button]{font-size:12px;padding:4px 14px;margin:2px;border:1px solid #666;background:#eee;cursor:pointer}
  input[type=button].primary{background:#2e5597;color:#fff;border-color:#2e5597}
  .err{background:#fde8e8;border:1px solid #e88;color:#900;padding:6px 10px;margin:8px 0;font-size:12px}
  .ok{background:#e6f5ea;border:1px solid #6b6;padding:6px 10px;margin:8px 0}
  .menu{display:flex;gap:24px}.menu .btns{display:flex;flex-direction:column;gap:8px;width:360px}
  .menu .btns input{padding:10px;font-size:13px}
  .note{color:#666;font-size:11px}.req{color:#c00}
  .box{border:1px solid #bbb;padding:8px 12px;margin:8px 0;background:#fbfbfb}
  .sec{font-weight:bold;background:#e8ebf0;padding:4px 8px;margin-top:12px;border-left:4px solid #2b3a67}
  .ftr{padding:8px 16px;color:#777;font-size:11px;border-top:1px solid #ddd;margin-top:24px}
  .home{padding:40px;text-align:center}.home a{display:inline-block;margin:12px;padding:16px 28px;border:1px solid #888;background:#fff;text-decoration:none;color:#222;font-size:15px}
  .kpi{display:flex;gap:12px;margin:8px 0}.kpi div{border:1px solid #bbb;padding:8px 14px;background:#fafafa;min-width:120px}.kpi b{font-size:20px;display:block}
  .good{color:#070}.bad{color:#b00}.warn{color:#a60}
  .subnav a{margin-right:14px;font-size:12px}
  textarea{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid #999;padding:4px}
  pre{font-size:11px;background:#f6f6f6;padding:8px;max-height:260px;overflow:auto}
</style>
</head><body><div id="app"></div>
<script>
/* ============ 共通 ============ */
const CASES = [];
const CRED = { hep: { id: 'hoshino', pw: 'hep2026' }, hpg: { id: 'K000000777', pw: 'hpg2026' }, admin: null };
const KEY = 'mockState_v1';
const BUILD = 'candidate';
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.apps) return s; } catch (e) {}
  return { apps: [], log: [], settings: { autoIssueMin: 2, examDate: '' }, session: {}, seq: 0, tseq: 0 };
}
function save(s) { localStorage.setItem(KEY, JSON.stringify(s)); }
let S = load();
function log(site, ev, detail) { S.log.push({ t: new Date().toISOString(), site, ev, detail: detail || '' }); if (S.log.length > 2000) S.log.shift(); save(S); }
function today() { if (S.settings.examDate) { const d = new Date(S.settings.examDate + 'T00:00:00'); if (!isNaN(d)) return d; } const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
function fmt(d) { return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }
function expectedDate() { const d = today(); const t = new Date(d); t.setMonth(t.getMonth() + 2); if (t.getDay() === 0) t.setDate(t.getDate() - 1); return ymd(t); }
function isHankaku(s) { return /^[\x20-\x7E]*$/.test(s); }
function isZenkaku(s) { return s.length > 0 && !/[\x21-\x7E]/.test(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function h(html) { document.getElementById('app').innerHTML = html; window.scrollTo(0, 0); }
function fv(form, name) { const el = form.elements[name]; if (!el) return ''; if (el.length && el[0] && el[0].type === 'radio') { for (const r of el) if (r.checked) return r.value; return ''; } return (el.value || '').trim(); }
function go(hash) { location.hash = hash; }
function checkAutoIssue() {
  const m = Number(S.settings.autoIssueMin || 0); if (!m) return false;
  let changed = false;
  for (const a of S.apps) if (a.status === '申込受付待ち' && Date.now() - a.createdAt > m * 60000) { issue(a, true); changed = true; }
  if (changed) save(S);
  return changed;
}
function issue(a, auto) {
  S.tseq++; a.takuso = '32265' + String(9000000 + S.tseq).padStart(8, '0'); a.status = '託送申込済'; a.takusoAt = Date.now();
  a.mails = a.mails || []; a.mails.push({ t: Date.now(), subject: '【HEP】託送申込番号のお知らせ（' + a.d.meigi2 + '）', body: '申込番号 ' + a.hepNo + ' について受付処理が完了し、託送申込番号が発行されました。\n託送申込番号：' + a.takuso + '\n契約名義：' + a.d.meigi1 + '　' + a.d.meigi2 + '\nHPG託送Web申込システムにて設備情報の訂正登録をお願いします。' });
  log('admin', auto ? '自動発行' : '受付処理', a.hepNo + ' → ' + a.takuso);
}
const SAFE_PAGES = ['', 'hep', 'hep/list', 'hep/mail', 'hep/menu', 'hep/done', 'hpg', 'hpg/menu', 'hpg/search', 'submit'];
function curPage() { return location.hash.replace(/^#\/?/, '').split('/').slice(0, 2).join('/'); }
setInterval(() => {
  S = load(); const changed = checkAutoIssue(); const key = curPage();
  const editing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
  const imp = document.getElementById('imp');
  if (key === 'admin') { if (!editing && !(imp && imp.value.trim())) route(); return; }
  if (changed && SAFE_PAGES.includes(key)) route();
}, 15000);
window.addEventListener('storage', () => { S = load(); });

/* ============ ルーティング ============ */
function route() {
  S = load(); checkAutoIssue();
  const hs = location.hash.replace(/^#\/?/, '').split('/');
  const site = hs[0] || '', pg = hs[1] || '';
  if (site === 'hep') return HEP(pg, hs[2]);
  if (site === 'hpg') return HPG(pg, hs[2]);
  if (site === 'files') return filesPage();
  if (site === 'submit') return submitPage();
  h(`<div class="home"><h2>申込Webモック環境</h2><p class="note">面接用の架空サイトです。実在の事業者・システムとは関係ありません。</p>
  <a href="#/hep">ひかり電力エナジー<br>工事店Web申込サービス</a><a href="#/hpg">ひかり電力パワーグリッド<br>託送Web申込システム</a><br><a href="#/files" style="font-size:12px;padding:8px 16px">課題資料をダウンロード</a><a href="#/submit" style="font-size:12px;padding:8px 16px">提出コードを作成する</a></div>`);
}
window.addEventListener('hashchange', route);

/* ============ HEP ============ */
function hepWrap(title, body) {
  return `<div class="site hep"><div class="hdr"><b>HIKARI ENERGY</b><span><small>ひかり電力エナジー株式会社　工事店Web申込サービス</small></span></div>
  <div class="ttl">${title}<span style="float:right;font-weight:normal;font-size:12px">${S.session.hep ? 'ログインユーザ：株式会社ホシノ電設 さま　<a href="#/hep/logout">ログアウト</a>　<a href="#/hep/mail">受信メール</a>　<a href="#/files">資料</a>　<a href="#/submit">提出コード</a>' : ''}</span></div>
  <div class="cnt">${body}</div><div class="ftr">Copyright (c) HIKARI Energy Co.,Ltd. (mock)</div></div>`;
}
function HEP(pg, arg) {
  log('hep', '画面', pg || 'login');
  if (pg === 'logout') { S.session.hep = false; save(S); return go('#/hep'); }
  if (!S.session.hep) return h(hepWrap('ログイン', `
    <div id="e"></div><form name="f"><table class="f" style="width:420px"><tr><th>ユーザID</th><td><input type="text" name="id" size="20"> (半角)</td></tr>
    <tr><th>パスワード</th><td><input type="password" name="pw" size="20"> (半角)</td></tr></table>
    <input type="button" class="primary" value="ログイン" onclick="hepLogin(this.form)"></form>`));
  const p = { menu: hepMenu, list: hepList, consent: hepConsent, form1: hepForm1, form2: hepForm2, confirm: hepConfirm, done: hepDone, mail: hepMail, detail: hepDetail }[pg || 'menu'];
  return p ? p(arg) : go('#/hep/menu');
}
window.hepLogin = f => { if (fv(f, 'id') === CRED.hep.id && fv(f, 'pw') === CRED.hep.pw) { S.session.hep = true; save(S); log('hep', 'ログイン'); go('#/hep/menu'); } else { document.getElementById('e').innerHTML = '<div class="err">S7ZZZZE0001 ユーザIDまたはパスワードが正しくありません。</div>'; } };
function hepMenu() {
  h(hepWrap('申込メニュー', `<div class="menu"><div class="btns">
    <input type="button" value="低圧（特定小売供給約款）のお申込み" onclick="go('#/hep/list')">
    <input type="button" value="低圧（電気需給約款／エリア内）のお申込み" onclick="alert('本試験では使用しません')">
    <input type="button" value="低圧（集合住宅）のお申込み" onclick="alert('本試験では使用しません')">
    <input type="button" value="高圧・特別高圧のお申込み" onclick="alert('本試験では使用しません')">
    <input type="button" value="ユーザ情報変更" onclick="alert('本試験では使用しません')">
    <input type="button" value="パスワード変更" onclick="alert('本試験では使用しません')"></div>
    <div class="box" style="flex:1"><b>【低圧（特定小売供給約款）のお申込み】</b><br>特定小売供給約款とは以下のプランをいいます。<br>定額電灯、従量電灯A/B/C、臨時電灯A/B/C、公衆街路灯A/B、低圧電力、臨時電力、農事用電力</div></div>`));
}
function hepList() {
  const rows = S.apps.map((a, i) => `<tr><td>${i + 1}</td><td><input type="radio" name="sel" value="${a.id}"></td><td>${a.hepNo}</td><td>1</td><td>${a.takuso || ''}</td><td></td><td>${esc(a.d.meigi1)}<br>${esc(a.d.meigi2)}</td><td>${fmt(new Date(a.createdAt))}</td><td>${a.d.date}</td><td>${a.status}</td><td>${esc(a.d.addr)}${esc(a.d.banchi)}</td></tr>`).join('');
  h(hepWrap('低圧一括申込検索一覧', `<form name="f">
  <div>検索条件　<input type="radio" name="k" checked> 代表申込検索　<input type="radio" name="k"> 関連申込情報による代表申込検索</div>
  <table class="f"><tr><th>申込状況</th><td><select name="st"><option></option><option>一時保存</option><option>申込受付待ち</option><option>申込受付完了</option><option>託送申込済</option><option>落成登録待ち</option><option>工事完了</option><option>申込取消</option></select></td><th>申込年月日</th><td><input type="text" size="8"> ～ <input type="text" size="8"></td><th>託送申込番号</th><td><input type="text" name="tk" size="14"></td></tr>
  <tr><th>申込種別</th><td><select disabled><option>新設</option></select></td><th>申込番号</th><td><input type="text" name="no" size="14"></td><th>設計番号</th><td><input type="text" size="10"></td></tr>
  <tr><th>契約名義1（カナ）</th><td><input type="text" size="24"> (全角)</td><th>契約名義1（漢字）</th><td colspan="3"><input type="text" size="30"> (全角)</td></tr></table>
  <input type="button" value="検索" onclick="route()"> <input type="button" value="戻る" onclick="go('#/hep/menu')">
  <div class="note">・代表申込のみ検索結果に表示されます。</div>
  <div class="sec">検索結果</div>
  <table class="r"><tr><th>No</th><th>選択</th><th>申込番号</th><th>同時申込件数</th><th>託送申込番号</th><th>設計番号</th><th>契約名義</th><th>申込年月日</th><th>送電希望日</th><th>申込状況</th><th>契約住所</th></tr>${rows || '<tr><td colspan="11" style="text-align:center;color:#888">該当する申込はありません</td></tr>'}</table>
  <div style="margin-top:8px"><input type="button" class="primary" value="新規登録" onclick="go('#/hep/consent')"> <input type="button" value="参照登録" onclick="alert('本試験では使用しません')"> <input type="button" value="詳細" onclick="hepSel(this.form,'detail')"> <input type="button" value="修正" onclick="alert('申込受付待ち以外は修正できません')"> <input type="button" value="取消" onclick="alert('本試験では使用しません')"></div></form>`));
}
window.hepSel = (f, to) => { const v = fv(f, 'sel'); if (!v) return alert('申込を選択してください'); go('#/hep/' + to + '/' + v); };
function hepConsent() {
  S.tmp = S.tmp || {}; S.tmp.consentOpened = false; save(S);
  h(hepWrap('低圧電気契約承諾', `<div id="e"></div><form name="f">
  <p>お申込みおよびご契約に関する以下の電気需給契約における重要事項をご確認のうえ、承諾いただける場合は、「承諾する」にチェックをして「次へ」ボタンを押してください。</p>
  <input type="button" value="電気需給契約における重要事項" style="background:#c33;color:#fff;padding:14px 30px;font-size:14px" onclick="hepOpenTerms()">
  <p style="margin-top:20px">上記電気需給契約における重要事項に承諾する。 <input type="checkbox" name="ok"></p>
  <input type="button" value="戻る" onclick="go('#/hep/list')"> <input type="button" class="primary" value="次へ" onclick="hepConsentNext(this.form)"></form>`));
}
window.hepOpenTerms = () => { S.tmp.consentOpened = true; save(S); log('hep', '重要事項を表示'); alert('【電気需給契約における重要事項】（モック）\n・本申込は架空のものです。\n・送電希望日は入力日を除いて10日以上先としてください。\n・契約名義は名義1が20文字を超える場合、名義2へ分割してください。'); };
window.hepConsentNext = f => {
  const e = document.getElementById('e');
  if (!S.tmp || !S.tmp.consentOpened) { e.innerHTML = '<div class="err">S7ZZZZE1162 電気需給契約における重要事項ボタンを押下し、内容をご確認ください。</div>'; log('hep', 'エラー', 'E1162'); return; }
  if (!f.elements.ok.checked) { e.innerHTML = '<div class="err">S7ZZZZE1037 電気需給契約における重要事項に承諾いただける場合は、「承諾する」にチェックしてください。</div>'; log('hep', 'エラー', 'E1037'); return; }
  go('#/hep/form1');
};
function hepForm1() {
  const d = (S.tmp && S.tmp.d) || {};
  const v = n => esc(d[n] || '');
  h(hepWrap('低圧一括申込登録（共通項目）', `<div id="e"></div><form name="f"><div class="note"><span class="req">*</span> は、必須入力項目です</div>
  <div class="sec">お申込み内容（代表申込　共通項目）</div>
  <table class="f">
  <tr><th>申込種別<span class="req">*</span></th><td>新設</td></tr>
  <tr><th>送電希望年月日<span class="req">*</span></th><td><input type="text" name="date" size="10" value="${v('date')}"> 例 20260401 ※入力日を除いて１０日以上先の日付を入力してください。</td></tr>
  <tr><th>契約名義<span class="req">*</span></th><td>(名　義) <input type="text" name="meigi1" size="30" value="${v('meigi1')}"> (全角文字)<br>(フリガナ) <input type="text" name="kana1" size="40" value="${v('kana1')}"> (全角英数カナ)<br>
  <span class="note">※契約名義が20文字を超える場合は下段へ入力願います。漢字名義は各20文字以内、カナ名義は各39文字以内で入力してください。</span><br>
  (名　義) <input type="text" name="meigi2" size="30" value="${v('meigi2')}"> (全角文字)<br>(フリガナ) <input type="text" name="kana2" size="40" value="${v('kana2')}"> (全角英数カナ)</td></tr>
  <tr><th>郵便番号<span class="req">*</span></th><td><input type="text" name="zip1" size="3" value="${v('zip1')}"> - <input type="text" name="zip2" size="4" value="${v('zip2')}"> <input type="button" value="住所検索" onclick="alert('モックでは住所を直接入力してください')"> (半角数字)<br><span class="note">※こちらは「ご使用場所住所」を入力する欄となります。</span></td></tr>
  <tr><th>住所（都道府県～丁目）<span class="req">*</span></th><td><input type="text" name="addr" size="50" value="${v('addr')}"> (全角文字)</td></tr>
  <tr><th>住所（番地・号）<span class="req">*</span></th><td><input type="text" name="banchi" size="12" value="${v('banchi')}"> (全角数字・全角ハイフン)</td></tr>
  <tr><th>住所（建物名）</th><td>(建物名) <input type="text" name="bld" size="30" value="${v('bld')}"> (全角文字)　<input type="checkbox" name="nobld" ${d.nobld ? 'checked' : ''}> 建物名なし</td></tr>
  <tr><th>電話番号1<span class="req">*</span></th><td><select name="teltype"><option>事務所</option><option>自宅</option><option>携帯</option><option>その他</option></select> <input type="text" name="tel" size="14" value="${v('tel')}"> (半角数字・ハイフン)</td></tr>
  </table>
  <div class="sec">請求情報（郵送先）</div>
  <table class="f"><tr><th>請求先</th><td><input type="checkbox" name="samebill" ${d.samebill !== false ? 'checked' : ''}> 契約名義・ご使用場所と同じ</td></tr>
  <tr><th>建築会社名／販売店名<span class="req">*</span></th><td><input type="text" name="builder" size="30" value="${v('builder')}"> (全角文字) ※該当しない場合は「なし」</td></tr></table>
  <div class="sec">電気工事店情報</div>
  <table class="f"><tr><th>電気工事店登録番号<span class="req">*</span></th><td><input type="text" name="kojiten" size="10" value="${v('kojiten')}"> (半角) ※HPGが発行する工事店番号</td></tr>
  <tr><th>会社名</th><td>株式会社ホシノ電設</td></tr>
  <tr><th>担当者名<span class="req">*</span></th><td>(名　義) <input type="text" name="tanto" size="20" value="${v('tanto')}"> (全角)　(フリガナ) <input type="text" name="tantokana" size="20" value="${v('tantokana')}"></td></tr>
  <tr><th>担当者連絡先<span class="req">*</span></th><td><input type="text" name="tantotel" size="14" value="${v('tantotel')}"> (半角)</td></tr>
  <tr><th>メールアドレス<span class="req">*</span></th><td><input type="text" name="mail" size="40" value="${v('mail')}"> (半角)</td></tr>
  <tr><th>HPG「託送Web申込システム」ID<span class="req">*</span></th><td><input type="text" name="hpgid" size="14" value="${v('hpgid')}"> (半角) ※設備情報のご登録をいただくユーザIDを入力してください。</td></tr></table>
  <div class="sec">工事費等支払情報</div>
  <table class="f"><tr><th>支払方法<span class="req">*</span></th><td><select name="pay"><option value="">　</option><option ${d.pay === 'Web決済サービス' ? 'selected' : ''}>Web決済サービス</option></select></td></tr>
  <tr><th>ひかり電力への連絡事項</th><td><input type="text" name="memo" size="60" value="${v('memo')}"></td></tr></table>
  <div class="sec">添付ファイル</div>
  <div class="note">・『平面図』の添付が必須です。①平面図 ②幹線系統図 ③その他資料 の順に添付してください。</div>
  <table class="r"><tr><th>No</th><th>ファイル</th><th>ファイル内容</th></tr>

/* ============ 提出コード（状態のエクスポート／インポート） ============ */
function b64(u8) { let r = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) r += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(r); }
function ub64(str) { const bin = atob(str); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
async function packState() {
  const payload = { v: 1, at: new Date().toISOString(), apps: S.apps, log: S.log, settings: S.settings };
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  if (typeof CompressionStream === 'function') {
    const cs = new CompressionStream('gzip'); const w = cs.writable.getWriter(); w.write(bytes); w.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    return 'HZ1:' + b64(new Uint8Array(buf));
  }
  return 'HZ0:' + b64(bytes);
}
async function unpackState(code) {
  const m = /^HZ([01]):([A-Za-z0-9+/=]+)$/.exec(String(code).replace(/\s+/g, ''));
  if (!m) throw new Error('コードの形式が正しくありません（HZ1: で始まる文字列を貼り付けてください）');
  const bytes = ub64(m[2]);
  let json;
  if (m[1] === '0') json = new TextDecoder().decode(bytes);
  else { const ds = new DecompressionStream('gzip'); const w = ds.writable.getWriter(); w.write(bytes); w.close(); json = new TextDecoder().decode(new Uint8Array(await new Response(ds.readable).arrayBuffer())); }
  const o = JSON.parse(json);
  if (!o || !Array.isArray(o.apps)) throw new Error('コードの内容が読み取れませんでした');
  return o;
}

  <div class="ttl">提出コードの作成</div><div class="cnt">
  <p>下のボタンを押すと、これまでの登録内容と操作履歴を1つのコードにまとめます。面接官に<b>チャットで貼り付ける</b>か、<b>ファイルを送って</b>ください。</p>

  </div><div class="ftr">この画面のコードには、あなたが登録した内容と操作履歴のみが含まれます。</div></div>`);
}
window.makeCode = async () => {
  const out = document.getElementById('out');
  out.innerHTML = '<p class="note">作成中…</p>';
  try {
    const code = await packState();
    log('submit', '提出コード作成', code.length + '文字');
    out.innerHTML = `<div class="ok">提出コードを作成しました（${code.length.toLocaleString()}文字）。</div>
    <textarea id="code" rows="6" style="width:100%" readonly>${esc(code)}</textarea>
    <p><input type="button" class="primary" value="コピーする" onclick="copyCode()"> <input type="button" value="ファイルとして保存" onclick="dlCode()"> <span id="cpmsg" class="note"></span></p>`;
  } catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
};
window.copyCode = () => {
  const t = document.getElementById('code'); t.select();
  const done = () => { document.getElementById('cpmsg').textContent = 'コピーしました。面接官に貼り付けてください。'; };
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand('copy'); done(); });
  else { document.execCommand('copy'); done(); }
};
window.dlCode = () => {
  const blob = new Blob([document.getElementById('code').value], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '提出コード_' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.txt';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
